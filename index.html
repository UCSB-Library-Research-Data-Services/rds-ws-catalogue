<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RDS Workshops Catalogue</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/app.css?v=0.0.25">
    </head>
    <body>
        <div class="container-fluid">
            <header class="py-4 mb-4 border-bottom">
                <div class="container position-relative">
                    <img src="assets/imgs/HexSticker-RDS.png" alt="RDS Logo" class="rds-hex-logo">
                    <div class="row">
                        <div class="col-md-8 offset-md-2 col-lg-9 offset-lg-1">
                            <h1 class="display-4 mb-2">Research Data Services</h1>
                            <p class="lead">Workshop Catalogue</p>
                        </div>
                    </div>
                </div>
            </header>

            <div class="container-fluid">
                <div class="row">
                    <!-- Sidebar Filters -->
                    <aside class="col-lg-3 col-md-4 sidebar-filters" id="sidebarFilters">
                        <div class="sidebar-resize-handle" id="sidebarResizeHandle" title="Drag to resize sidebar"></div>
                        <div class="sidebar-content">
                            <!-- Timeframe Toggle -->
                            <div class="mb-4">
                                <h6 class="sidebar-section-title">Show Workshops</h6>
                                <div class="btn-group w-100" role="group" aria-label="Timeframe toggle">
                                    <button type="button" class="btn btn-outline-primary active" id="upcomingBtn" data-timeframe="upcoming">
                                        <i class="bi bi-calendar-plus"></i> Upcoming
                                    </button>
                                    <button type="button" class="btn btn-outline-primary" id="pastBtn" data-timeframe="past">
                                        <i class="bi bi-calendar-check"></i> Past
                                    </button>
                                </div>
                            </div>

                            <hr>

                            <!-- Filters Header -->
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="sidebar-section-title mb-0"><i class="bi bi-funnel"></i> Filters</h6>
                                <button class="btn btn-sm btn-link text-decoration-none p-0" id="clearFilters">
                                    <i class="bi bi-x-circle"></i> Clear
                                </button>
                            </div>

                            <!-- Search Box -->
                            <div class="mb-3">
                                <label for="searchInput" class="form-label">Search</label>
                                <input type="search" class="form-control form-control-sm" id="searchInput" placeholder="Search workshops...">
                            </div>

                            <!-- Area Filter -->
                            <div class="mb-3">
                                <label for="areaFilter" class="form-label">Research Area</label>
                                <select class="form-select form-select-sm" id="areaFilter">
                                    <option value="">All Areas</option>
                                </select>
                            </div>

                            <!-- Audience Filter -->
                            <div class="mb-3">
                                <label for="audienceFilter" class="form-label">Audience</label>
                                <select class="form-select form-select-sm" id="audienceFilter">
                                    <option value="">All Audiences</option>
                                </select>
                            </div>

                            <!-- Format Filter -->
                            <div class="mb-3">
                                <label for="formatFilter" class="form-label">Format</label>
                                <select class="form-select form-select-sm" id="formatFilter">
                                    <option value="">All Formats</option>
                                </select>
                            </div>

                            <!-- Department Filter -->
                            <div class="mb-3">
                                <label for="departmentFilter" class="form-label">Department</label>
                                <select class="form-select form-select-sm" id="departmentFilter">
                                    <option value="">All Departments</option>
                                </select>
                            </div>

                            <!-- Instructor Filter -->
                            <div class="mb-3">
                                <label for="instructorFilter" class="form-label">Instructor</label>
                                <select class="form-select form-select-sm" id="instructorFilter">
                                    <option value="">All Instructors</option>
                                </select>
                            </div>

                            <hr>

                            <!-- Active Filters -->
                            <div class="mb-3" id="activeFiltersContainer">
                                <small class="text-muted d-block mb-2">Active filters:</small>
                                <div id="activeFilters" class="d-flex flex-wrap gap-1">
                                    <!-- Active filter pills will be inserted here -->
                                </div>
                            </div>

                            <!-- Calendar Subscription -->
                            <button class="btn btn-primary w-100" id="subscribeCalendar">
                                <i class="bi bi-bell"></i> Get Reminders
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content -->
                    <main class="col-lg-9 col-md-8">

                        <!-- Mobile Filter Toggle -->
                        <button class="btn btn-outline-primary mb-3 d-md-none" type="button" id="filterToggleBtn">
                            <i class="bi bi-funnel"></i> Filters
                        </button>

                        <!-- Results Count -->
                        <div class="row mb-3">
                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <h5 id="resultsCount" class="mb-0">Loading workshops...</h5>
                            <div class="d-flex align-items-center gap-2">
                                <div class="btn-group" role="group" aria-label="View toggle">
                                    <button type="button" class="btn btn-sm btn-outline-secondary active" id="listViewBtn" title="List view">
                                        <i class="bi bi-list-ul"></i>
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" id="gridViewBtn" title="Grid view">
                                        <i class="bi bi-grid-3x3-gap"></i>
                                    </button>
                                </div>
                                <div class="d-flex align-items-center">
                                    <label for="sortBy" class="form-label me-2 mb-0">Sort by:</label>
                                    <select class="form-select form-select-sm d-inline-block w-auto" id="sortBy">
                                        <option value="date">Date</option>
                                        <option value="title">Title</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                        <!-- Workshop List -->
                        <div class="row" id="workshopList">
                            <!-- Workshop cards will be inserted here -->
                        </div>
                    </main>
                </div>
            </div>

            <footer class="py-4 border-top">
                <div class="container">
                    <div class="row mb-3">
                        <div class="col-12 text-center">
                            <p class="mb-1 text-muted">Maintained by UCSB Library's Research Data Services</p>
                            <p class="mb-0">
                                <a href="mailto:rds@library.ucsb.edu" class="text-decoration-none">
                                    <i class="bi bi-envelope"></i> rds@library.ucsb.edu
                                </a>
                            </p>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 pt-3 border-top">
                        <div class="flex-fill footer-links">
                            <a href="privacy.html">Privacy</a>
                        </div>
                        <p class="text-muted mb-0 flex-fill text-center">
                            &copy; 2026 Research Data Services | UCSB Library
                        </p>
                        <div class="flex-fill text-end footer-links">
                            <a href="https://github.com/UCSB-Library-Research-Data-Services/rds-ws-catalogue" target="_blank">
                                View on GitHub&nbsp;
                                <i class="bi bi-github"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="assets/js/ical-generator.js"></script>
        <script src="assets/js/add-to-calendar.js"></script>
        <script src="assets/js/app.js"></script>
    </body>
</html>
